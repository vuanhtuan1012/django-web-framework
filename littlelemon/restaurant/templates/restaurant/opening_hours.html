{% extends "restaurant/base.html" %}

{% block title %}
Little Lemon - Opening Hours
{% endblock %}

{% block content %}
<section class="max-w-4xl mx-auto px-6 py-24">
  <h2 class="text-3xl font-bold text-center mb-16 flex items-center justify-center gap-3 text-primary">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
      class="size-16">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
    Opening Hours
  </h2>

  <div class="bg-primary text-white rounded-2xl shadow-lg p-12 text-center space-y-6">
    <div class="flex justify-between max-w-md mx-auto text-lg">
      <span class="font-medium">Mon - Fri</span>
      <span>2pm - 10pm</span>
    </div>

    <div class="border-t border-white/30 max-w-md mx-auto"></div>

    <div class="flex justify-between max-w-md mx-auto text-lg">
      <span class="font-medium">Saturday</span>
      <span>2pm - 11pm</span>
    </div>

    <div class="border-t border-white/30 max-w-md mx-auto"></div>

    <div class="flex justify-between max-w-md mx-auto text-lg">
      <span class="font-medium">Sunday</span>
      <span>2pm - 9pm</span>
    </div>
  </div>
</section>
{% endblock %}
